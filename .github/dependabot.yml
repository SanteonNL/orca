# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # Go
  - package-ecosystem: "gomod"
    directories:
      - "/orchestrator"
      - "/e2e-tests"
    schedule:
      interval: "daily"

  # Docker
  - package-ecosystem: "docker"
    directories:
      - "/orchestrator"
      - "/frontend"
      - "/hospital_simulator"
      - "/viewer_simulator"
    schedule:
      interval: "daily"

  # npm
  - package-ecosystem: "npm"
    directories:
      - "/frontend"
      - "/hospital_simulator"
      - "/viewer_simulator"
    schedule:
      interval: "daily"
    # eslint 10 removed context.getFilename(); eslint-plugin-react (pinned by
    # eslint-config-next) still calls it and crashes the lint run. Unpin when
    # eslint-plugin-react ships eslint 10 support.
    ignore:
      - dependency-name: "eslint"
        versions: ["10.x"]
      - dependency-name: "@eslint/js"
        versions: ["10.x"]