#
name: ORCA Frontend Sonar Scan

# Configures this workflow to run every time a change is pushed.
on:
  pull_request:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend_sonar.yaml
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend_sonar.yaml

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  sonar-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 23
      # Reads the version from frontend/package.json "packageManager". pnpm 8 cannot read a
      # lockfileVersion 9 lockfile and would silently re-resolve the whole tree.
      - name: Install pnpm as prerequisite for caching setup.
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Install dependencies
        working-directory: ./frontend
        run: |
          pnpm -v
          pnpm install --frozen-lockfile
      - name: run frontend tests
        working-directory: ./frontend
        run: |
          pnpm test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: -Dsonar.sources=.
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info
            -Dsonar.coverage.exclusions=**/*.test.ts,**/*.test.js,**/*.test.jsx,**/*.test.tsx,**/*.spec.ts,**/*.spec.js,**/*.spec.jsx,**/*.spec.tsx,**/*.stories.jsx,**/*.stories.tsx*,**/*.test-data.ts,*.config.*
            -Dsonar.cpd.exclusions=**/*.test.ts,**/*.test.js,**/*.test.jsx,**/*.test.tsx,**/*.spec.ts,**/*.spec.js,**/*.spec.jsx,**/*.spec.tsx,**/*.stories.jsx,**/*.stories.tsx*,**/*.test-data.ts,**/fhir-v*-response.ts,src/components/ui/fonts/index.ts
            -Dsonar.issue.ignore.multicriteria=e1
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S5332
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test*.ts
